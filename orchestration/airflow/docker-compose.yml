# Local Airflow (LocalExecutor + Postgres metadata DB). Start everything with:
#   docker compose -f orchestration/airflow/docker-compose.yml up --build
# UI: http://localhost:8080 (no login: SimpleAuthManager with all users admin, local use only).

x-airflow-common: &airflow-common
  build:
    context: ../..
    dockerfile: orchestration/airflow/Dockerfile
  env_file:
    # Required: AIRFLOW__API_AUTH__JWT_SECRET and AIRFLOW__CORE__FERNET_KEY (see .env.example),
    # plus the Snowflake / Kaggle variables for the dev and prod targets.
    - ../../.env
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    # Fixed Linux paths: a Windows-style path in .env would be meaningless inside the container.
    DUCKDB_PATH: /opt/project/data/ci/credit_risk.duckdb
  volumes:
    - ./dags:/opt/airflow/dags
    - ../..:/opt/project
  depends_on: &airflow-depends-on
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      # Same literal as the official Airflow compose. This database only holds Airflow metadata,
      # lives on the private compose network and publishes no port, so it is unreachable from
      # outside. Do not reuse this password, and do not add a `ports:` entry here.
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command: >
      -c "airflow db migrate &&
      airflow pools set dbt_warehouse $${DBT_POOL_SLOTS:-1} 'Serializes warehouse-writing tasks'"
    depends_on: *airflow-depends-on

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 15s
      retries: 10
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    # The scheduler runs the tasks (LocalExecutor), so only it gets the Snowflake key: mounted
    # read-only from the host, never copied into the image. The path is overridden here because
    # the one in .env is a Windows path. Set SNOWFLAKE_KEY_DIR if your key is not in ~/.snowflake
    # (the file must be called rsa_key.p8).
    environment:
      <<: *airflow-env
      SNOWFLAKE_PRIVATE_KEY_PATH: /run/snowflake/rsa_key.p8
    volumes:
      - ./dags:/opt/airflow/dags
      - ../..:/opt/project
      - ${SNOWFLAKE_KEY_DIR:-${USERPROFILE:-${HOME}}/.snowflake}:/run/snowflake:ro
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    # Cosmos runs `dbt ls` while parsing, so the dbt packages must exist before the first parse.
    entrypoint: /bin/bash
    command: -c "cd /opt/project/dbt && dbt deps && exec /entrypoint airflow dag-processor"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-db:
