[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-risk-pipeline"
version = "0.1.0"
description = "Production-style credit risk data pipeline (Home Credit) on Snowflake + dbt + Airflow, with a DuckDB CI target."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "duckdb>=1.1",
    "snowflake-connector-python>=3.12",
    "kaggle>=1.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dbt = [
    "dbt-core>=1.10,<2",
    "dbt-duckdb>=1.10,<2",
    "dbt-snowflake>=1.10,<2",
]
dev = [
    "ruff>=0.6",
    "sqlfluff>=3.2",
    "pytest>=8",
    "pre-commit>=3.8",
]

[tool.setuptools.packages.find]
include = ["credit_risk_pipeline*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
