# Same checks as the CI lint job. Install once with: pre-commit install
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format --check
        entry: ruff format --check
        language: system
        types: [python]
      - id: sqlfluff-lint
        name: sqlfluff lint (dbt templater, duckdb dialect)
        # The dbt templater compiles the project, so the ci database must exist first:
        #   python scripts/load_raw.py --target ci
        entry: python scripts/lint_sql.py
        language: system
        files: ^dbt/(models|tests|snapshots)/.*\.sql$
