name: CI

# Everything runs on the `ci` target (DuckDB + the committed 5,000-client sample).
# No job needs Snowflake or Kaggle credentials, and none is given any secret.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DUCKDB_PATH: ${{ github.workspace }}/data/ci/credit_risk.duckdb
  DBT_SEND_ANONYMOUS_USAGE_STATS: "false"

jobs:
  lint:
    name: Lint (ruff, sqlfluff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -r requirements.txt
      - name: Cache dbt packages
        uses: actions/cache@v4
        with:
          path: dbt/dbt_packages
          key: dbt-packages-${{ hashFiles('dbt/packages.yml', 'dbt/package-lock.yml') }}
      - run: ruff check .
      - run: ruff format --check .
      # The dbt templater compiles the project, so it needs the dbt packages and the ci database.
      - run: dbt deps
        working-directory: dbt
      - run: python scripts/load_raw.py --target ci
      - run: python scripts/lint_sql.py

  test:
    name: Test (pytest, dbt build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -r requirements.txt
      - name: Cache dbt packages
        uses: actions/cache@v4
        with:
          path: dbt/dbt_packages
          key: dbt-packages-${{ hashFiles('dbt/packages.yml', 'dbt/package-lock.yml') }}
      # Airflow-dependent tests skip themselves here; the `dags` job runs them.
      - run: pytest -q
      - run: dbt deps
        working-directory: dbt
      - run: python scripts/load_raw.py --target ci
      # Fails the job if any test with severity error fails (severity warn is only reported).
      - name: dbt build (models, tests)
        run: dbt build --target ci --exclude "snp_loan_status+"
        working-directory: dbt
      # The SCD2 snapshot needs the simulated monthly loads before it and its tests mean anything.
      - name: Snapshot replay (last 12 months) and snapshot tests
        run: |
          python scripts/replay_loan_status.py --target ci --start -12 --end -1 --fresh
          cd dbt && dbt test --target ci --select "snp_loan_status+"
      - run: python scripts/verify_pipeline.py --target ci --with-snapshot

  dags:
    name: Airflow DAG tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Layer cache: the image (Airflow + Cosmos + dbt venv) only rebuilds when its inputs change.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: orchestration/airflow/Dockerfile
          tags: credit-risk-airflow:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Cosmos renders the graph with `dbt ls`, which needs the dbt packages and a DuckDB path.
      - name: DagBag, dependency, retry and secret-scan tests
        run: |
          # The image runs as uid 50000 and the runner owns the checkout as another uid:
          # make it writable so dbt can create dbt_packages/ and logs/.
          chmod -R a+rwX .
          docker run --rm -e DUCKDB_PATH=/tmp/ci.duckdb -v "$PWD:/opt/project" \
            --entrypoint bash credit-risk-airflow:ci -c \
            "cd /opt/project/dbt && dbt deps && cd .. && pytest tests/test_dags.py -q -p no:cacheprovider"
