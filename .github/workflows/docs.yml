name: Docs

# Publishes the dbt docs site to GitHub Pages on every push to main.
# Built on the `ci` target (DuckDB sample): no credentials involved.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  DUCKDB_PATH: ${{ github.workspace }}/data/ci/credit_risk.duckdb
  DBT_SEND_ANONYMOUS_USAGE_STATS: "false"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -r requirements.txt
      - name: Cache dbt packages
        uses: actions/cache@v4
        with:
          path: dbt/dbt_packages
          key: dbt-packages-${{ hashFiles('dbt/packages.yml', 'dbt/package-lock.yml') }}
      - run: dbt deps
        working-directory: dbt
      - run: python scripts/load_raw.py --target ci
      # docs generate reads the warehouse catalog, so the models and the snapshot must exist.
      - run: dbt build --target ci --exclude "snp_loan_status+"
        working-directory: dbt
      - run: python scripts/replay_loan_status.py --target ci --start -1 --end -1 --fresh
      - run: dbt docs generate --target ci
        working-directory: dbt
      - name: Collect the static site
        run: |
          mkdir site
          cp dbt/target/index.html dbt/target/manifest.json dbt/target/catalog.json site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
